version: '3.9'

services:
  api:
    container_name: skill-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: 1.24
    environment:
      APP_PORT: "8080"
      DB_HOST: "mysql:3306"
      DB_NAME: "skills_db"
      DB_USER: "skill_user"
      DB_PASSWORD: "skill_pass"
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    container_name: skills-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: skills_db
      MYSQL_USER: skill_user
      MYSQL_PASSWORD: skill_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
